# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Mod Properties
version=1.2.0
group=dev.highbitrate.chattoolkit

# Dependencies
fabric_api_version=0.166.2+26.3
modmenu_version=21.0.0-beta.1

# Be gentle with remote repositories (retry with backoff on HTTP 429)
systemProp.org.gradle.internal.repository.max.retries=12
systemProp.org.gradle.internal.repository.initial.backoff=1500
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
